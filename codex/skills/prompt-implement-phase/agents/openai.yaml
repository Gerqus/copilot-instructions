interface:
  display_name: "Prompt: implement phase"
  short_description: "Implement one user-indicated phase from a whole plan without overstepping into other phases."
  default_prompt: "In the context of the whole plan, use prompt-implement to work on the single phase of the plan indicated by the user. Report back when it is done. Be mindful not to overstep into other phases, but do not defer work that belongs to this phase. Use minimal code changes to fulfill the goals of this phase, considering future phase work. Do not shy away from asking clarifying questions interactively if you encounter something unexpected."
